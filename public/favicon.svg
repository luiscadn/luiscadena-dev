<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BEF264"/>
      <stop offset="100%" stop-color="#A3D900"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Neural constellation grid line behind -->
  <line x1="18" y1="20" x2="46" y2="44" stroke="rgba(56, 189, 248, 0.18)" stroke-width="1.2" stroke-dasharray="2 2"/>
  <line x1="18" y1="44" x2="46" y2="20" stroke="rgba(163, 217, 0, 0.18)" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- "L" Monogram Stem -->
  <path d="M 21 19 L 21 44 L 33 44" 
        fill="none" 
        stroke="#F8FAFC" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- "C" Monogram Arc -->
  <path d="M 45 22.5 C 41 18.5, 34 18.5, 30.5 23 C 27 27.5, 27 35.5, 30.5 40 C 34 44.5, 41 44.5, 45 40.5" 
        fill="none" 
        stroke="url(#cyanGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round"/>

  <!-- Glowing Neural Core Node (The "Apex Node") -->
  <circle cx="21" cy="19" r="3.2" fill="url(#limeGrad)" filter="url(#glow)"/>
  <circle cx="21" cy="19" r="1.6" fill="#FFFFFF"/>

  <!-- Satellite Connection Node -->
  <circle cx="45" cy="22.5" r="2.2" fill="#38BDF8"/>
  <circle cx="33" cy="44" r="2.2" fill="#A3D900"/>
</svg>
